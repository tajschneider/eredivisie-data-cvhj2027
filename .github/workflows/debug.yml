name: Debug een wedstrijd
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Wedstrijd-URL van pouletips'
        required: true
        default: 'https://pouletips.nl/eredivisie/wedstrijd/ajax-sc-heerenveen/'

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests beautifulsoup4
      - run: python scrape_eredivisie.py --debug "${{ inputs.url }}"
