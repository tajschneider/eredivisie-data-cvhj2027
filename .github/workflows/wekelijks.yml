name: CVHJ wekelijks advies

# Draait in dezelfde repo als de scraper. clubs.csv en spelers.csv staan hier al
# in de hoofdmap, dus er hoeft niets opgehaald te worden -- de scripts vinden ze
# op hun standaardpaden.
#
# Maandag 07:00 UTC, een uur na scrape.yml (06:00), zodat de data van die dag er
# staat. Donderdag 09:00 UTC nog een keer: opstellingen en blessures veranderen
# na het weekend, en dan is de deadline dichtbij genoeg om betekenisvol te zijn.
on:
  schedule:
    - cron: '0 7 * * 1'
    - cron: '0 9 * * 4'
  workflow_dispatch:
    inputs:
      ronde:
        description: 'Speelronde (leeg = automatisch de eerstvolgende)'
        required: false
      transfers:
        description: "Aantal transfers: 'auto' volgt de perioden, of 0/1/3"
        default: 'auto'

permissions:
  contents: write

# scrape.yml pusht ook naar main. Twee gelijktijdige pushes geven een
# afgewezen push; deze groep zet ze achter elkaar.
concurrency:
  group: push-main
  cancel-in-progress: false

jobs:
  advies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: pip install requests beautifulsoup4 numpy scipy

      - name: Controleren of de scraperdata er is
        run: |
          for f in clubs.csv spelers.csv selectie.csv perioden.csv; do
            [ -f "$f" ] || { echo "::error::$f ontbreekt in de repo"; exit 1; }
          done
          echo "clubs.csv:   $(($(wc -l < clubs.csv) - 1)) regels"
          echo "spelers.csv: $(($(wc -l < spelers.csv) - 1)) regels"

      - name: Prijzen en posities ophalen
        run: python scrape_prijzen.py

      # HORIZON_SCRAPE (standaard 6) haalt in één keer ruim genoeg ronden op
      # voor de langste periode (5 ronden) plus marge. multi_periode.py's
      # eigen --horizon auto bepaalt daarna hoeveel daarvan echt meetellen
      # voor DEZE beslissing (tot de volgende periodestart) -- extra
      # opgehaalde ronden die niet nodig zijn, worden gewoon genegeerd.
      - name: Programma komende ronden ophalen
        run: python scrape_programma.py --horizon "${{ vars.HORIZON_SCRAPE || 6 }}"

      - name: Ronde bepalen
        id: ronde
        run: |
          if [ -n "${{ github.event.inputs.ronde }}" ]; then
            echo "nr=${{ github.event.inputs.ronde }}" >> $GITHUB_OUTPUT
          else
            echo "nr=$(python -c "import csv;print(next(csv.DictReader(open('programma.csv')))['ronde'])")" >> $GITHUB_OUTPUT
          fi

      # Waarborg voor de MILP: met --horizon 1 moet multi_periode.py exact
      # hetzelfde vinden als cvhj_model.py's brute-force zoeker (zie
      # test_multi_periode.py). Faalt dit, dan is er iets stuk aan de nieuwe
      # zoeker -- val dan terug op de beproefde eenronde-zoeker, maar laat
      # wel zien dat het is misgegaan (continue-on-error zodat de mail
      # hieronder nog steeds verstuurd wordt).
      - name: Regressietest multi-ronde model
        id: regressie
        continue-on-error: true
        run: python test_multi_periode.py

      - name: Model draaien
        run: |
          set -o pipefail
          if [ "${{ steps.regressie.outcome }}" = "success" ]; then
            python multi_periode.py \
              --ronde ${{ steps.ronde.outputs.nr }} \
              --transfers ${{ github.event.inputs.transfers || 'auto' }} \
              --horizon auto \
              --decay "${{ vars.DECAY || 0.84 }}" \
              --json besluit.json | tee advies.txt || {
                echo "::warning::multi_periode.py mislukt op ronde ${{ steps.ronde.outputs.nr }} -- terugvallen op cvhj_model.py (één ronde vooruit)"
                python cvhj_model.py \
                  --ronde ${{ steps.ronde.outputs.nr }} \
                  --transfers ${{ github.event.inputs.transfers || 'auto' }} \
                  --json besluit.json | tee advies.txt
              }
          else
            echo "::error::regressietest multi_periode.py is mislukt -- terugvallen op cvhj_model.py (één ronde vooruit); dit verdient een blik voor volgende week."
            python cvhj_model.py \
              --ronde ${{ steps.ronde.outputs.nr }} \
              --transfers ${{ github.event.inputs.transfers || 'auto' }} \
              --json besluit.json | tee advies.txt
          fi

      - name: Advies mailen
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_POORT: ${{ secrets.SMTP_POORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_WACHTWOORD: ${{ secrets.SMTP_WACHTWOORD }}
          MAIL_NAAR: ${{ secrets.MAIL_NAAR }}
        run: python notify.py besluit.json

      - name: Besluit vastleggen
        run: |
          mkdir -p historie
          cp besluit.json "historie/ronde-${{ steps.ronde.outputs.nr }}.json"
          cp advies.txt   "historie/ronde-${{ steps.ronde.outputs.nr }}.txt"
          git config user.name  "cvhj-bot"
          git config user.email "bot@users.noreply.github.com"
          git add prijzen.csv programma.csv historie/
          git diff --staged --quiet && { echo "niets gewijzigd"; exit 0; }
          git commit -m "advies ronde ${{ steps.ronde.outputs.nr }}"
          # scrape.yml kan intussen gepusht hebben; eerst bijtrekken.
          git pull --rebase origin main
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: besluit-ronde-${{ steps.ronde.outputs.nr }}
          path: |
            besluit.json
            advies.txt
            programma.csv
            prijzen.csv

  # ---------------------------------------------------------------------------
  # Inleggen op coachvanhetjaar.nl. Aparte job, zodat het advies blijft draaien
  # als het inleggen stukloopt en je dit kunt uitzetten zonder de rest te raken.
  #
  # inleggen.py is gebouwd door de site's eigen (interne, ongedocumenteerde)
  # API terug te lezen uit een HAR-export van een echte, handmatige transfer --
  # zie de docstring van dat bestand voor precies wat daarin wel en niet
  # geverifieerd is. Zet INLEGGEN pas op 'ja' NADAT je dit met DRY_RUN op 'ja'
  # (de standaard) een paar keer handmatig hebt gedraaid en de voorgestelde
  # transfer(s) in de uitvoer kloppen. Zet DRY_RUN pas op 'nee' als je dat
  # vertrouwt -- dat legt daadwerkelijk iets in op de site.
  # ---------------------------------------------------------------------------
  inleggen:
    needs: advies
    runs-on: ubuntu-latest
    if: vars.INLEGGEN == 'ja'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests beautifulsoup4

      - uses: actions/download-artifact@v4
        with: { pattern: besluit-ronde-*, merge-multiple: true }

      - name: Deadline controleren
        id: check
        run: python deadline.py programma.csv --uren "${{ vars.DEADLINE_UREN || 6 }}"

      - name: Team doorzetten
        if: steps.check.outputs.binnen_venster == 'ja'
        env:
          CVHJ_GEBRUIKER: ${{ secrets.CVHJ_GEBRUIKER }}
          CVHJ_WACHTWOORD: ${{ secrets.CVHJ_WACHTWOORD }}
          DRY_RUN: ${{ vars.DRY_RUN || 'ja' }}
        run: python inleggen.py besluit.json
