name: xG-data ophalen (Sofascore)

# ALLEEN HANDMATIG, EN OP EEN GITHUB-RUNNER WERKT HET NIET.
#
# Vastgesteld op 7 september 2026: Sofascore geeft een 403 op de gedeelde
# IP-reeksen van GitHub-hosted runners, bij het allereerste verzoek. Precies
# wat FBref daarvoor ook deed. Twee verschillende sites, hetzelfde patroon --
# cloud-IP's worden categorisch geblokkeerd, ongeacht wat je verstuurt.
#
# Daarom staat het schema hieronder UIT. Deze workflow heeft alleen zin als je
# hem op een SELF-HOSTED RUNNER draait (dan gaat het verkeer via jouw eigen IP):
# zet dan `runs-on: self-hosted` hieronder, en haal de twee cron-regels uit het
# commentaar. De tijden liggen bewust vóór wekelijks.yml (ma 07:00, do 09:00).
#
# Zonder self-hosted runner: draai `python scrape_sofascore.py` op je eigen
# machine en commit xg.csv zelf. Ontbreekt xg.csv helemaal, dan draait het
# model zoals vóór stap 5 -- een mindere schatting, geen storing.
#
# LET OP bij de eerste keer: controleer in de samenvatting het aantal spelers,
# het aantal clubs (18) en of er geen onbekende clubnamen worden gemeld. Het
# script schrijft niets bij te weinig spelers, dus half gevulde data kan niet
# doorstromen.
on:
  # Uitgezet zolang dit op een GitHub-hosted runner draait -- zie hierboven.
  # schedule:
  #   - cron: '0 5 * * 1'
  #   - cron: '0 8 * * 4'
  workflow_dispatch:
    inputs:
      seizoen:
        description: 'Seizoen-id forceren (leeg = automatisch het nieuwste)'
        required: false

permissions:
  contents: write

concurrency:
  group: push-main
  cancel-in-progress: false

jobs:
  xg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # requests: voor scrape_sofascore.py zelf.
      # numpy:    test_sofascore.py controleert de koppeling met het model en
      #           importeert daarvoor cvhj_model.py, dat numpy nodig heeft.
      #           Weglaten geeft een ModuleNotFoundError in de teststap.
      - run: pip install requests numpy

      # Draait hier omdat deze workflow toch al twee keer per week draait en
      # zijn falen niets kritieks blokkeert: de controle kijkt of ALLE workflows
      # installeren wat hun scripts nodig hebben. Precies de fout die deze
      # workflow zelf maakte (numpy vergeten), maar dan voordat hij live gaat.
      - name: Workflows controleren op ontbrekende afhankelijkheden
        run: python test_workflows.py

      - name: Regressietest scraper
        run: python test_sofascore.py

      - name: xG-data ophalen
        run: |
          set -o pipefail
          python scrape_sofascore.py \
            ${{ github.event.inputs.seizoen && format('--seizoen {0}', github.event.inputs.seizoen) || '' }} \
            | tee xg_log.txt

      - name: Samenvatting
        run: |
          {
            echo "### xG-data opgehaald (Sofascore)"
            echo ""
            echo '```'
            cat xg_log.txt
            echo '```'
            echo ""
            echo "Eerste regels van xg.csv:"
            echo '```'
            head -5 xg.csv
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Vastleggen
        run: |
          git config user.name  "cvhj-bot"
          git config user.email "bot@users.noreply.github.com"
          git add xg.csv
          git diff --staged --quiet && { echo "niets gewijzigd"; exit 0; }
          git commit -m "xG-data bijgewerkt $(date +%F)"
          git pull --rebase origin main
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xg
          path: |
            xg.csv
            xg_log.txt
