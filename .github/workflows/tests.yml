name: Tests

# Draait bij ELKE push, en dat is precies het punt.
#
# De terugkerende storing in dit project is niet een fout in de logica maar een
# onvolledige upload: een bestand dat niet mee is gekomen, een workflow die iets
# installeert wat niet meer klopt, twee scripts die uit elkaar zijn gelopen.
# Die kosten nu een halve week, omdat ze pas opvallen als de wekelijkse
# workflow maandagochtend struikelt.
#
# Deze tests hebben geen netwerk, geen secrets en geen verse scrapes nodig --
# ze draaien op wat er in de repo staat. Binnen een minuut na je push weet je
# dus of de upload compleet en consistent is, in plaats van maandag.
#
# Wat ze afvangen, allemaal fouten die hier daadwerkelijk zijn opgetreden:
#   test_workflows.py       ontbrekend bestand, vergeten pip-pakket,
#                           ongeschermde `git add`
#   test_multi_periode.py   de MILP en de brute-force zoeker die uiteenlopen
#   test_scrape_prijzen.py  statuswoorden die aan spelersnamen blijven plakken
#   test_statistieken.py    het ontleden van de ranglijsten
#   test_synchroniseer.py   de selectie-synchronisatie, inclusief de weigering
#                           om half werk weg te schrijven
#   test_notify.py          dat elke waarschuwing die het model uitrekent ook
#                           daadwerkelijk in de mail belandt
#   test_valideer.py        de poortwachter die bepaalt of de periodieke
#                           validatie uberhaupt draait, en de trendregel
#   test_grenzen.py         de hekken om een automatisch voorstel: welke
#                           bestanden het mag raken, en dat het geen tests
#                           mag verzwakken om zelf te slagen
on:
  push:
    branches: [main]
  # OOK op elke pull request, en dat is niet cosmetisch. Automatische
  # voorstellen komen binnen als PR; draaien de tests daar niet, dan is
  # "eerst testen, dan goedkeuren" een afspraak zonder handhaving en keur je
  # een wijziging goed die nooit gedraaid heeft.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: pip install requests beautifulsoup4 numpy scipy

      # Deze eerst: hij controleert of de andere scripts er überhaupt zijn en
      # of elke workflow installeert wat hij nodig heeft. Ontbreekt er iets,
      # dan is dat de nuttigste melding en hoeft de rest niet meer te draaien.
      - name: Repo-consistentie
        run: python test_workflows.py

      - name: Scrapers en koppeling
        run: |
          python test_scrape_prijzen.py
          python test_statistieken.py
          python test_synchroniseer.py
          python test_notify.py
          python test_valideer.py
          python test_grenzen.py

      # Heeft clubs.csv/spelers.csv/prijzen.csv/programma.csv/selectie.csv nodig.
      # Staan die er niet, dan is dat geen testfout maar een lege repo; dan
      # wordt deze stap overgeslagen in plaats van vals alarm te geven.
      - name: Model (MILP vs brute force)
        run: |
          ontbreekt=""
          for f in clubs.csv spelers.csv prijzen.csv programma.csv selectie.csv; do
            [ -f "$f" ] || ontbreekt="$ontbreekt $f"
          done
          if [ -n "$ontbreekt" ]; then
            echo "::warning::test_multi_periode.py OVERGESLAGEN -- deze data ontbreekt:$ontbreekt. De MILP is deze run dus NIET getoetst."
          else
            python test_multi_periode.py
          fi

  # ---------------------------------------------------------------------------
  # Alleen op een pull request: blijft het voorstel binnen de grenzen?
  #
  # Dit staat los van de testsuites hierboven. Die controleren of de code nog
  # klopt; deze job controleert of de WIJZIGING zelf toelaatbaar is -- of hij
  # niet aan inleggen.py komt (het enige script dat echte transfers doorvoert),
  # niet aan de workflows (die zichzelf rechten kunnen geven), en geen tests
  # verzwakt om zelf te slagen. Die grenzen staan in grenzen.py en gelden voor
  # elke PR, ongeacht wie of wat hem opende.
  # ---------------------------------------------------------------------------
  grenzen:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }      # volledige historie: nodig voor de diff

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Grenzen controleren
        run: |
          set -o pipefail
          git fetch origin ${{ github.base_ref }} --depth=50
          git diff --name-only origin/${{ github.base_ref }}...HEAD > gewijzigd.txt
          python grenzen.py --gewijzigd gewijzigd.txt \
                            --basis origin/${{ github.base_ref }} | tee grenzen.log

      - name: Uitslag in de samenvatting
        if: always() && hashFiles('grenzen.log') != ''
        run: |
          {
            echo '## Grenzen'
            echo '```'
            cat grenzen.log
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
